<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camper Manual</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .language-picker { text-align: right; margin-bottom: 20px; }
        select { padding: 5px; border-radius: 5px; }
        
        /* Accordion styling */
        .accordion {
            background-color: #eee; color: #444; cursor: pointer; padding: 18px; width: 100%;
            border: none; text-align: left; outline: none; font-size: 16px; transition: 0.4s;
            margin-bottom: 5px; border-radius: 5px; display: flex; align-items: center;
        }
        .active, .accordion:hover { background-color: #ccc; }
        .icon { margin-right: 15px; font-size: 20px; }
        .panel { padding: 0 18px; display: none; background-color: white; overflow: hidden; border-left: 3px solid #ccc; margin-bottom: 10px; }
        .video-section { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="language-picker">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="da">Dansk</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>

    <h2 data-key="title-tech">🛠️ Teknisk Manual</h2>

    <button class="accordion"><span class="icon">🔥</span> <span data-key="heat">Varme</span></button>
    <div class="panel"><p data-key="heat-desc"></p></div>

    <button class="accordion"><span class="icon">💧</span> <span data-key="water">Vand</span></button>
    <div class="panel"><p data-key="water-desc"></p></div>

    <button class="accordion"><span class="icon">⚡</span> <span data-key="el">El</span></button>
    <div class="panel"><p data-key="el-desc"></p></div>

    <button class="accordion"><span class="icon">⛽</span> <span data-key="gas">Gas</span></button>
    <div class="panel"><p data-key="gas-desc"></p></div>

    <button class="accordion"><span class="icon">❄️</span> <span data-key="fridge">Køleskab</span></button>
    <div class="panel"><p data-key="fridge-desc"></p></div>

    <button class="accordion"><span class="icon">🚽</span> <span data-key="toilet">Toilet</span></button>
    <div class="panel"><p data-key="toilet-desc"></p></div>

    <button class="accordion"><span class="icon">🛡️</span> <span data-key="safety">Sikkerhed</span></button>
    <div class="panel"><p data-key="safety-desc"></p></div>

    <button class="accordion"><span class="icon">🏁</span> <span data-key="return">Aflevering af bil</span></button>
    <div class="panel"><p data-key="return-desc"></p></div>

    <div class="video-section">
        <h2 data-key="title-video">📺 Videoguider</h2>
        <p data-key="video-comming">Video kommer snart...</p>
    </div>
</div>

};

function changeLanguage(lang) {
    document.querySelectorAll("[data-key]").forEach(elem => {
        const key = elem.getAttribute("data-key");
        if (translations[lang][key]) {
            elem.textContent = translations[lang][key];
        }
    });
}

// Initialisering af accordion-funktionalitet
const acc = document.getElementsByClassName("accordion");
for (let i = 0; i < acc.length; i++) {
    acc[i].addEventListener("click", function() {
        this.classList.toggle("active");
        const panel = this.nextElementSibling;
        panel.style.display = (panel.style.display === "block") ? "none" : "block";
    });
}

// Sæt standardsprog ved start
changeLanguage('da');
</script>

</body>
</html>
