<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camper Guide</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg-color); }
        
        /* Menu-faner */
        .tab-bar {
            display: flex;
            background: var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active { border-bottom: 4px solid var(--accent-color); font-weight: bold; }

        /* Indhold */
        .content-section { display: none; padding: 20px; animation: fadeIn 0.5s; }
        .content-section.active { display: block; }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 format */
            height: 0;
            overflow: hidden;
            margin: 15px 0;
            border-radius: 8px;
        }

        .video-container iframe, .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="tab-bar">
        <button class="tab-btn active" onclick="openTab('elektrisk')">⚡ Strøm</button>
        <button class="tab-btn" onclick="openTab('vand')">💧 Vand</button>
        <button class="tab-btn" onclick="openTab('guides')">📺 Videoer</button>
    </nav>

    <!-- Sektion: Elektrisk -->
    <div id="elektrisk" class="content-section active">
        <h2>Elektrisk System</h2>
        <p>Her finder du vejledning til bilens 12V system og lithium-batterier.</p>
        <ul>
            <li>Hovedafbryder findes under førersædet.</li>
            <li>Overvåg dit forbrug via displayet.</li>
        </ul>
    </div>

    <!-- Sektion: Vand -->
    <div id="vand" class="content-section">
        <h2>Vand & Varme</h2>
        <p>Sådan påfylder du vand og tømmer spildevand.</p>
    </div>

    <!-- Sektion: Videoer -->
    <div id="guides" class="content-section">
        <h2>Videoguider</h2>
        <div class="video-container">
            <!-- Eksempel på video - erstat 'src' med din egen fil eller YouTube link -->
            <video controls>
                <source src="din-video-fil.mp4" type="video/mp4">
                Din browser understøtter ikke video.
            </video>
        </div>
        <p>Se hvordan du klargør camperen til natten.</p>
    </div>

    <script>
        function openTab(tabId) {
            // Skjul alle sektioner
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(s => s.classList.remove('active'));

            // Fjern aktiv klasse fra knapper
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));

            // Vis den valgte sektion
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
