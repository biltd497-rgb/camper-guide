    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .language-picker { text-align: right; margin-bottom: 20px; }
        select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; width: 100%; max-width: 150px; }
        
        .accordion {
            background-color: #eee; color: #444; cursor: pointer; padding: 18px; width: 100%;
            border: none; text-align: left; outline: none; font-size: 16px; transition: 0.4s;
            margin-bottom: 5px; border-radius: 5px; display: flex; align-items: center; font-weight: bold;
        }
        .active, .accordion:hover { background-color: #ccc; }
        .icon { margin-right: 15px; font-size: 20px; }
        .panel { padding: 0 18px; display: none; background-color: white; overflow: hidden; border-left: 3px solid #ccc; margin-bottom: 10px; }
        
        .video-title { font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #555; font-size: 14px; }
        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            max-width: 100%; background: #000; border-radius: 8px; margin-bottom: 15px;
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>

function changeLanguage(lang) {
    document.querySelectorAll("[data-key]").forEach(elem => {
        const key = elem.getAttribute("data-key");
        if (translations[lang][key]) elem.textContent = translations[lang][key];
    });

    document.querySelectorAll("iframe").forEach(iframe => {
        const id = iframe.id;
        const key = "v-" + id.replace("video-", "");
        if (translations[lang][key]) {
            const baseSrc = translations[lang][key];
            const separator = baseSrc.includes('?') ? '&' : '?';
            iframe.src = baseSrc + separator + `cc_load_policy=1&cc_lang_pref=${lang}&hl=${lang}`;
        } else {
            iframe.src = "";
        }
    });
}

const acc = document.getElementsByClassName("accordion");
for (let i = 0; i < acc.length; i++) {
    acc[i].addEventListener("click", function() {
        this.classList.toggle("active");
        const panel = this.nextElementSibling;
        panel.style.display = (panel.style.display === "block") ? "none" : "block";
    });
}
