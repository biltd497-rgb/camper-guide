<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <!-- Sikrer at appen fylder hele skærmen på mobilen uden zoom-fejl -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camper Vejledning</title>
    <style>
        :root {
            --hovedfarve: #2c3e50; /* Mørkeblå */
            --knapfarve: #3498db;  /* Lyseblå */
            --baggrund: #f4f7f6;
        }

        body { font-family: sans-serif; margin: 0; background: var(--baggrund); }

        /* Menu-navigation */
        .nav-menu {
            display: flex;
            background: var(--hovedfarve);
            position: sticky;
            top: 0;
        }

        .nav-btn {
            flex: 1;
            padding: 20px 10px;
            border: none;
            background: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-btn.active {
            border-bottom: 4px solid var(--knapfarve);
        }

        /* Indholds-sektioner */
        .section { display: none; padding: 25px; }
        .section.active { display: block; }

        .placeholder-box {
            background: #ddd;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px dashed #999;
        }
    </style>
</head>
<body>

    <nav class="nav-menu">
        <button class="nav-btn active" onclick="visSide('start')">Hjem</button>
        <button class="nav-btn" onclick="visSide('teknik')">Teknik</button>
        <button class="nav-btn" onclick="visSide('video')">Videoer</button>
    </nav>

    <div id="start" class="section active">
        <h1>Velkommen</h1>
        <p>Scan QR-koden i bilen for altid at have manualen ved hånden.</p>
    </div>

    <div id="teknik" class="section">
        <h1>Tekniske instruktioner</h1>
        <p>Her kommer din tekst om batterier og vedligeholdelse.</p>
    </div>

    <div id="video" class="section">
        <h1>Videoguider</h1>
        <div class="placeholder-box">Video kommer snart...</div>
    </div>

    <script>
        function visSide(id) {
            // Find alle sektioner og skjul dem
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            // Find alle knapper og fjern deres aktive markering
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            // Vis den valgte sektion og marker knappen
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
